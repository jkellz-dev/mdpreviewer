name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this too, so nothing is published from a
  # commit that fails it.
  workflow_call:
permissions: {}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise installs hk and every linter it drives, so CI and a local
      # `mise run lint` run exactly the same checks.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      # Install the toolchain rust-toolchain.toml pins before hk starts its
      # steps in parallel: two cargo steps that each trigger rustup's
      # first-use install race on the same download.
      - run: rustup toolchain install
      # Share Cargo's target tree and registry between runs via mr-boxington
      # (mbx). The toolchain install above comes first so the cache key sees
      # the rustc the build uses. The default backend only saves on pushes to
      # the default branch; pull requests restore read-only, so they cannot
      # fill the quota or poison what main builds with.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
      - run: mise run lint
        env:
          # pinact checks pins against the GitHub API, which rate-limits
          # calls without a token. This variable is pinact's own, so zizmor
          # stays in offline mode.
          PINACT_GITHUB_TOKEN: ${{ github.token }}
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup, preinstalled on the runners, installs the toolchain that
      # rust-toolchain.toml pins. It equals `rust-version`, so this run is
      # also the minimum-supported-Rust check.
      - run: rustup toolchain install
      # Share Cargo's target tree and registry between runs via mr-boxington
      # (mbx). The toolchain install above comes first so the cache key sees
      # the rustc the build uses. The default backend only saves on pushes to
      # the default branch; pull requests restore read-only, so they cannot
      # fill the quota or poison what main builds with.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
      # Build and test through the mbx wrapper so the run populates and reuses
      # mbx's cache, including its native link cache on Linux.
      - run: mbx test --locked --all-targets
