name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this too, so nothing is published from a
  # commit that fails it.
  workflow_call:
permissions: {}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise installs hk and every linter it drives, so CI and a local
      # `mise run lint` run exactly the same checks.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Install the toolchain rust-toolchain.toml pins before hk starts its
      # steps in parallel: two cargo steps that each trigger rustup's
      # first-use install race on the same download.
      - run: rustup toolchain install
      # Reuse compiled dependencies between runs. Only main writes the cache;
      # pull requests read main's, so they cannot fill the quota or poison
      # what main builds with. It keys on the rustc version, so it follows
      # the toolchain install.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run lint
        env:
          # pinact checks pins against the GitHub API, which rate-limits
          # calls without a token. This variable is pinact's own, so zizmor
          # stays in offline mode.
          PINACT_GITHUB_TOKEN: ${{ github.token }}
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup, preinstalled on the runners, installs the toolchain that
      # rust-toolchain.toml pins. It equals `rust-version`, so this run is
      # also the minimum-supported-Rust check.
      - run: rustup toolchain install
      # Reuse compiled dependencies between runs. Only main writes the cache;
      # pull requests read main's, so they cannot fill the quota or poison
      # what main builds with. It keys on the rustc version, so it follows
      # the toolchain install.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --all-targets
