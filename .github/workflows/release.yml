name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # The same checks CI runs. release-plz publishes whatever version is on
  # main, so without this a commit that fails CI could still be released.
  ci:
    name: CI
    permissions:
      contents: read
    # `$/` is the newer self-repository form, but actionlint rejects it.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
  # Publish to crates.io, tag, and create the GitHub release for any version
  # that landed on main but is not published yet.
  release:
    name: Release-plz release
    needs: ci
    if: github.repository_owner == 'jkellz-dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  # Keep a PR open that bumps the version and writes the changelog for
  # everything merged since the last release.
  release-pr:
    name: Release-plz PR
    if: github.repository_owner == 'jkellz-dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  # Attach prebuilt binaries to the release release-plz just created. This has
  # to hang off the release job rather than a `release: published` trigger,
  # because releases created with GITHUB_TOKEN do not start new workflow runs.
  binaries:
    name: ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      TAG: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
          persist-credentials: false
      # Each target is its runner's host, which the toolchain that
      # rust-toolchain.toml pins already includes.
      - name: Use wild linker
        if: runner.os == 'Linux'
        # Link the Linux binary with wild, a much faster linker. The action
        # installs wild and points Cargo at it through ~/.cargo/config.toml
        # for the linux-gnu target; clang, its driver, ships on the runner.
        # It only writes Linux targets, so the macOS build is untouched.
        uses: wild-linker/action@df0907881edceed370dee3c817eecf8a890430ad # 0.11.0
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          name="mdpreviewer-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/mdpreviewer" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" mdpreviewer-*.tar.gz mdpreviewer-*.tar.gz.sha256 --clobber
