[package]
name = "mdpreviewer"
version = "0.1.3"
edition = "2024"
# The latest stable Rust, matching the toolchain pinned in
# rust-toolchain.toml. Bump the two together.
rust-version = "1.99"
description = "Live-reloading browser preview for a single Markdown or Typst file, with mermaid diagrams and cursor sync for Helix."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jkellz-dev/mdpreviewer"
homepage = "https://github.com/jkellz-dev/mdpreviewer"
readme = "README.md"
keywords = ["markdown", "typst", "preview", "helix", "live-reload"]
categories = ["command-line-utilities", "text-processing", "development-tools"]
include = [
    "src/**/*.rs",
    "assets/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
comrak = "0.55.0"
notify = "8.2.0"
open = "5.4.4"
tiny_http = "0.12.0"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts", "system-files", "datetime"] }
typst-layout = "0.15.1"
typst-svg = "0.15.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
