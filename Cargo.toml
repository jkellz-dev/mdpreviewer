[package]
name = "mdpreviewer"
version = "0.1.2"
edition = "2024"
# The floor is set by the bon and darling dependencies, which require 1.88.
# Verified with `cargo +1.88 check --all-targets --locked`.
rust-version = "1.88"
description = "Live-reloading browser preview for a single Markdown file, with mermaid diagrams and cursor sync for Helix."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jkellz-dev/mdpreviewer"
homepage = "https://github.com/jkellz-dev/mdpreviewer"
readme = "README.md"
keywords = ["markdown", "preview", "helix", "mermaid", "live-reload"]
categories = ["command-line-utilities", "text-processing", "development-tools"]
include = [
    "src/**/*.rs",
    "assets/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
comrak = "0.55.0"
notify = "8.2.0"
open = "5.4.4"
tiny_http = "0.12.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
