# MD013 line-length is enabled with reflow so long prose lines wrap on save.
# Tables and code blocks are exempt (tables here are intentionally wide and
# code cannot wrap safely).
[global]
exclude = [
    # Test fixtures: front matter escaping edge cases and a deliberately
    # invalid mermaid block.
    "examples",
    # Historical plan and spec records, kept as they were written.
    "docs/superpowers",
]

[MD013]
line-length = 120
heading-line-length = 120
code-blocks = false
tables = false
reflow = true
